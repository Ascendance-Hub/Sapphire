name: CI

on:
  push:
    branches: [main, preview]
    paths-ignore:
      - 'website/**'
      - 'docs/**'
  pull_request:
    branches: [main, preview]
    paths-ignore:
      - 'website/**'
      - 'docs/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
